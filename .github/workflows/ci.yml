name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: sh build_desktop.sh
      - run: codesign --verify --deep --strict 'Agent Orbit.app'
