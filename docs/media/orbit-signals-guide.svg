<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="title desc">
<title id="title">Agent Orbit 声浪阅读指南</title><desc id="desc">四个动态通道在同一基线叠加，内存静态显示。图形为示意数据。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07101F"/><stop offset="1" stop-color="#0D1D2D"/></linearGradient><linearGradient id="fill" x2="0" y2="1"><stop stop-color="#63D9FF" stop-opacity=".48"/><stop offset="1" stop-color="#63D9FF" stop-opacity=".05"/></linearGradient></defs>
<rect width="1440" height="830" rx="26" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,Arial,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="56" y="58" font-size="15" letter-spacing="3" fill="#63D9FF">AGENT ORBIT / SIGNAL ATLAS</text>
<text x="56" y="120" font-size="42" font-weight="600" fill="#E5F1FF">一圈声浪，五种线索。</text>
<text x="56" y="157" font-size="20" fill="#91A7C3">看形状辨认来源，看高低辨认该通道最近的强弱。</text>
<rect x="56" y="197" width="868" height="348" rx="18" fill="#091422" stroke="#21374B"/>
<text x="80" y="230" font-size="14" letter-spacing="1" fill="#91A7C3">同一圆周展开示意 · 非实时数据</text>
<path d="M96 434H848" stroke="#4E6982" stroke-width="1"/>
<path d="M96 434 L96 422 L143 412 L190 425 L237 389 L284 342 L331 403 L378 419 L425 372 L472 306 L519 376 L566 407 L613 416 L660 354 L707 284 L754 370 L801 410 L848 389 L848 434Z" fill="url(#fill)"/>
<polyline points="96,422 143,412 190,425 237,389 284,342 331,403 378,419 425,372 472,306 519,376 566,407 613,416 660,354 707,284 754,370 801,410 848,389" fill="none" stroke="#63D9FF" stroke-width="2" opacity=".75"/>
<path d="M96 434V429" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M143 434V425" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M190 434V410" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M237 434V419" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M284 434V404" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M331 434V354" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M378 434V388" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M425 434V420" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M472 434V426" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M519 434V328" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M566 434V364" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M613 434V413" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M660 434V422" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M707 434V394" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M754 434V352" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M801 434V418" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><path d="M848 434V379" stroke="#FF91B5" stroke-width="6" stroke-dasharray="5 3"/><polyline points="96,426 143,418 190,400 237,416 284,426 331,420 378,362 425,340 472,389 519,420 566,404 613,366 660,391 707,422 754,412 801,372 848,398" fill="none" stroke="#B99CFF" stroke-width="2"/><path d="M237 434V330" stroke="#FFD187" stroke-width="2"/><path d="M237 325l5 5-5 5-5-5Z" fill="#FFD187"/><path d="M425 434V276" stroke="#FFD187" stroke-width="2"/><path d="M425 271l5 5-5 5-5-5Z" fill="#FFD187"/><path d="M660 434V356" stroke="#FFD187" stroke-width="2"/><path d="M660 351l5 5-5 5-5-5Z" fill="#FFD187"/><path d="M801 434V314" stroke="#FFD187" stroke-width="2"/><path d="M801 309l5 5-5 5-5-5Z" fill="#FFD187"/>
<path d="M96 441H294" stroke="#7CE3C0" stroke-width="3" stroke-linecap="round"/>
<text x="96" y="487" font-size="17" fill="#91A7C3">24 秒前</text><path d="M230 481H690l-8-4m8 4-8 4" fill="none" stroke="#4E6982"/>
<text x="800" y="487" font-size="17" fill="#E5F1FF">现在</text>
<text x="56" y="582" font-size="21" fill="#E5F1FF">四层动态信号叠在同一圈，不分成四个同心圈。</text>
<text x="56" y="615" font-size="18" fill="#91A7C3">每个通道独立缩放；跨颜色、跨会话的高度不能直接比较。</text>
<rect x="998" y="226" width="4" height="44" rx="2" fill="#63D9FF"/><text x="1022" y="241" font-size="22" fill="#E5F1FF">输出光带</text><text x="1022" y="267" font-size="17" fill="#91A7C3">终端与主日志的变化</text><rect x="998" y="300" width="4" height="44" rx="2" fill="#FF91B5"/><text x="1022" y="315" font-size="22" fill="#E5F1FF">I/O 分段柱</text><text x="1022" y="341" font-size="17" fill="#91A7C3">根进程系统调用读写</text><rect x="998" y="374" width="4" height="44" rx="2" fill="#FFD187"/><text x="1022" y="389" font-size="22" fill="#E5F1FF">工具脉冲</text><text x="1022" y="415" font-size="17" fill="#91A7C3">已返回的工具结果</text><rect x="998" y="448" width="4" height="44" rx="2" fill="#B99CFF"/><text x="1022" y="463" font-size="22" fill="#E5F1FF">网络细线</text><text x="1022" y="489" font-size="17" fill="#91A7C3">已关联 TCP 字节变化</text><rect x="998" y="522" width="4" height="44" rx="2" fill="#7CE3C0"/><text x="1022" y="537" font-size="22" fill="#E5F1FF">内存标记</text><text x="1022" y="563" font-size="17" fill="#91A7C3">进程树 RSS · 静态</text>
<path d="M56 654H1384" stroke="#263B50"/>
<text x="56" y="697" font-size="22" fill="#E5F1FF">静默 ≠ 未知</text><text x="56" y="732" font-size="18" fill="#91A7C3">有采样、无新增：不画波峰。无法采集：标为未观测，不补成 0。</text>
<text x="850" y="697" font-size="22" fill="#E5F1FF">状态先于声浪</text><text x="850" y="732" font-size="18" fill="#91A7C3">等待、异常、离线后收起动态信号。</text>
<text x="56" y="791" font-size="14" fill="#7188A4">示意图 / 默认霓虹配色 · 实际颜色随皮肤变化 · 波峰不是 CPU、Token 或推理效率</text>
</g></svg>